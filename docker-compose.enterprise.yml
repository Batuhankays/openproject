# OpenProject Enterprise Patch - Docker Compose
# Enterprise özelliklerini aktive etmek için özel image kullanir

version: '3.8'

services:
  openproject:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    container_name: openproject-enterprise
    restart: unless-stopped
    ports:
      - "8200:80"
    environment:
      # Database configuration
      OPENPROJECT_DATABASE_ADAPTER: postgres
      OPENPROJECT_DATABASE_HOST: db
      OPENPROJECT_DATABASE_PORT: 5432
      OPENPROJECT_DATABASE_NAME: openproject
      OPENPROJECT_DATABASE_USERNAME: postgres
      OPENPROJECT_DATABASE_PASSWORD: openproject_password

      # Cache configuration
      OPENPROJECT_CACHE_MEMCACHE_SERVER: cache:11211

      # Rails secret key
      OPENPROJECT_SECRET_KEY_BASE: secret_key_base_change_me_in_production

      # Host configuration
      OPENPROJECT_HOST__NAME: localhost:8200
      OPENPROJECT_HTTPS: "false"

      # Enterprise banner'i gizle
      OPENPROJECT_EE__MANAGER__VISIBLE: "false"

    volumes:
      - openproject-data:/var/openproject/assets
      - openproject-logs:/var/log/supervisor
    depends_on:
      - db
      - cache
    networks:
      - openproject-network

  db:
    image: postgres:16-alpine
    container_name: openproject-db-enterprise
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: openproject_password
    volumes:
      - openproject-pgdata:/var/lib/postgresql/data
    networks:
      - openproject-network

  cache:
    image: memcached:latest
    container_name: openproject-cache-enterprise
    restart: unless-stopped
    networks:
      - openproject-network

volumes:
  openproject-data:
  openproject-pgdata:
  openproject-logs:


networks:
  openproject-network:
    driver: bridge
